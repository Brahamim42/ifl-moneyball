name: Weekly Scout Sync & Lineage Docs

on:
  schedule:
    # Saturday 21:30 UTC -> Saturday 23:30 IST (Israel Standard Time UTC+2)
    # Runs after Saturday matchday to ingest weekend match results
    - cron: '30 21 * * 6'
    # Sunday 05:00 UTC -> Sunday 07:00 IST (Israel Standard Time UTC+2)
    # Sunday morning run to enrich new players, build Gold marts, and generate Scout Digest
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback days for match watermarking / re-fetching'
        required: false
        default: '7'
        type: string
      dry_run:
        description: 'Run crawler & digest in dry-run mode (limited records / offline blurbs)'
        required: false
        default: false
        type: boolean

# Required permissions for GITHUB_TOKEN to deploy dbt docs to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weekly-scout-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-scout:
    name: Bronze Ingest, dbt Build & Scout Digest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          mkdir -p data/bronze data/silver output
          uv venv
          uv pip install -e ".[dev]"
          uv run playwright install --with-deps chromium

      - name: Run Bronze IFA Crawler (--lookback-days 7)
        env:
          HEADLESS_BROWSER: "true"
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'il-scout-bronze' }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          LOOKBACK="${{ github.event.inputs.lookback_days || '7' }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          echo "Executing IFA Crawler with lookback-days=${LOOKBACK} ${EXTRA_FLAGS}..."
          uv run python src/ingest/ifa_crawler.py --lookback-days "$LOOKBACK" $EXTRA_FLAGS

      - name: Run Player Profile Bio Enricher
        env:
          HEADLESS_BROWSER: "true"
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'il-scout-bronze' }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          echo "Executing Player Enricher for unseen players & club transfers..."
          uv run python src/ingest/player_enricher.py $EXTRA_FLAGS

      - name: Execute dbt Build
        id: dbt_build
        env:
          DBT_TARGET: ${{ secrets.MOTHERDUCK_TOKEN != '' && 'prod' || 'dev' }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'md:il_scout_engine' }}
        run: |
          echo "Executing dbt build (staging views -> silver star schema & SCD2 -> gold marts + tests)..."
          cd dbt_project
          uv run dbt build

      - name: Send Failure Webhook Alert (Telegram / Webhook / Email)
        if: failure() && steps.dbt_build.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "⚠️ dbt build failed! Dispatching failure alert notifications..."
          
          TELEGRAM_MSG="🚨 <b>[IL-Scout-Engine] Pipeline Alert</b>%0A%0A"
          TELEGRAM_MSG+="❌ <b>Failure:</b> dbt build failed (dimensional model or data quality test constraint violated)%0A"
          TELEGRAM_MSG+="📦 <b>Repository:</b> ${{ github.repository }}%0A"
          TELEGRAM_MSG+="🌿 <b>Branch:</b> ${{ github.ref_name }}%0A"
          TELEGRAM_MSG+="👤 <b>Triggered By:</b> ${{ github.actor }}%0A"
          TELEGRAM_MSG+="🔗 <a href='${RUN_URL}'>View GitHub Actions Run Logs</a>"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "Posting failure alert to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="${TELEGRAM_MSG}" || true
          fi

          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            echo "Posting failure alert to Webhook..."
            PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"event": "dbt_build_failure", "repository": os.environ.get("GITHUB_REPOSITORY", ""), "branch": os.environ.get("GITHUB_REF_NAME", ""), "run_url": os.environ.get("RUN_URL", ""), "message": "dbt build failed. Data quality test or model error detected."}))')
            curl -s -X POST "$ALERT_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || true
          fi

      - name: Run AI Scout Digest (Only If dbt Build Succeeded)
        if: steps.dbt_build.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DBT_TARGET: ${{ secrets.MOTHERDUCK_TOKEN != '' && 'prod' || 'dev' }}
        run: |
          EXTRA_FLAGS=""
          if [ -z "$ANTHROPIC_API_KEY" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          echo "Generating Sunday Scouting Digest with Claude AI & Jinja2 RTL templates..."
          uv run python src/reporting/scout_digest.py --region All $EXTRA_FLAGS

      - name: Archive Scouting Digest Artifacts
        if: steps.dbt_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-scouting-digest
          path: |
            output/sunday_digest.html
            output/whatsapp_digest.txt
            output/*.pdf
          retention-days: 14

      - name: Generate dbt Docs Static Site
        if: steps.dbt_build.outcome == 'success'
        env:
          DBT_TARGET: ${{ secrets.MOTHERDUCK_TOKEN != '' && 'prod' || 'dev' }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          echo "Generating dbt docs catalog & DAG lineage..."
          cd dbt_project
          uv run dbt docs generate
          cd ..
          mkdir -p target_docs
          cp dbt_project/target/index.html target_docs/
          cp dbt_project/target/manifest.json target_docs/
          cp dbt_project/target/catalog.json target_docs/

      - name: Upload GitHub Pages Artifact
        if: steps.dbt_build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target_docs

  deploy-docs:
    name: Deploy dbt Lineage Docs to GitHub Pages
    needs: sync-and-scout
    runs-on: ubuntu-latest
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
