[project]
name = "il-scout-engine"
version = "0.1.0"
description = "Israeli Lower-League & Youth Football Scouting Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "selectolax>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "tenacity>=8.2.0",
    "playwright>=1.40.0",
    "tzdata>=2024.1",
    "jinja2>=3.1.0",
    "anthropic>=0.20.0",
    "dbt-duckdb>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
